<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheat Sheets | Debtor Management Training</title>
<style>
  :root{--navy:#1B4F8C;--teal:#028090;--gold:#E8A800;--red:#C0392B;--green:#1E8449;--dark:#1C2B3A;--grey:#6B7C8E;--lgrey:#D6E0EB;--offwh:#F4F6F9;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:var(--offwh);color:var(--dark);}
  .site-header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
  .site-header-inner{display:flex;align-items:center;padding:12px 28px;border-left:6px solid var(--teal);gap:16px;}
  .site-header-inner h1{font-size:1rem;font-weight:700;}
  .back-link{color:#A8D4DF;font-size:.82rem;text-decoration:none;font-weight:700;margin-left:auto;}
  .role-tabs{background:#162e52;display:flex;overflow-x:auto;padding:0 28px;gap:2px;}
  .role-tab{background:none;border:none;color:#7fa8c9;font-size:.8rem;font-weight:700;padding:12px 16px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;}
  .role-tab:hover{color:#fff;}
  .role-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  main{max-width:920px;margin:0 auto;padding:28px 20px 80px;}
  .panel{display:none;}
  .panel.active{display:block;}
  h2.rt{color:var(--navy);font-size:1.4rem;margin-bottom:18px;border-bottom:3px solid var(--teal);padding-bottom:10px;}
  h3.sub{color:var(--navy);font-size:1.02rem;margin:22px 0 10px;border-left:5px solid var(--teal);padding-left:10px;}
  ul{padding-left:22px;margin-bottom:8px;}
  li{font-size:.9rem;margin-bottom:6px;line-height:1.5;}
  table{width:100%;border-collapse:collapse;margin:10px 0 6px;font-size:.85rem;}
  th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;}
  td{padding:8px 10px;border-bottom:1px solid var(--lgrey);}
  tr:nth-child(even) td{background:#fff;}
  tr:nth-child(odd) td{background:var(--offwh);}
  .note{border-left:5px solid;border-radius:6px;padding:12px 16px;margin-top:16px;font-size:.88rem;}
  .note.red{background:#FDF2F0;border-color:var(--red);}
  .note.navy{background:#EEF2F8;border-color:var(--navy);}
  .note.gold{background:#FDF8E6;border-color:var(--gold);}
  .note b{display:block;margin-bottom:4px;font-size:.78rem;letter-spacing:.04em;}
</style>
</head>
<body>
<header class="site-header"><div class="site-header-inner">
  <h1>Healthia Debtor Management — Cheat Sheets</h1>
  <a class="back-link" href="index.html">← Training Hub</a>
</div></header>
<div class="role-tabs" id="roleTabs"></div>
<main id="panels"></main>
<script>
const roles = [
  {id:'admin', label:'All Admin Team', html:`
    <h2 class="rt">All Admin Team — Quick Reference</h2>
    <h3 class="sub">Payment Expectations</h3>
    <table><tr><th>Client Type</th><th>Target Timeframe</th><th>Rule</th></tr>
      <tr><td>Private Clients</td><td>At time of invoice / within 7 days</td><td>No accounts offered — collect on the spot</td></tr>
      <tr><td>Private Entities</td><td>30 days</td><td></td></tr>
      <tr><td>Third Party (DVA, Medicare, NDIS, Insurers)</td><td>60 days</td><td>Submit via online portal where possible</td></tr>
    </table>
    <h3 class="sub">Daily Bank Reconciliation — 5 Steps</h3>
    <ul>
      <li>1. Download bank transactions from clinic account</li>
      <li>2. Match HICAPS/EFTPOS + other deposits to remittances → receipt in Nookal (date = day receipted, not day received)</li>
      <li>3. Make invoice adjustments per the Nookal Invoice Adjustments Guide if needed</li>
      <li>4. Complete an Inter Clinic Transfer for any deposits that aren't yours</li>
      <li>5. Run the Nookal Banking Report and confirm it matches the bank total</li>
    </ul>
    <h3 class="sub">0–30 Day Follow-Up (Your Responsibility)</h3>
    <ul>
      <li>Check for rejected claims first — resubmit via HICAPS Digital/Tyro or email</li>
      <li>Private client unpaid after appointment → call + SMS + email within 48 hours</li>
      <li>Still unpaid when client leaves → add alert note "OUTSTANDING DEBT" to their profile</li>
      <li>Set a follow-up reminder in Nookal</li>
    </ul>
    <div class="note red"><b>REMEMBER</b>Never let the same client build up multiple unpaid services — this is how small debts become large, unrecoverable ones.</div>
  `},
  {id:'pm', label:'Trained Admin & PM', html:`
    <h2 class="rt">Trained Admin &amp; Practice Manager — Quick Reference</h2>
    <h3 class="sub">Your Core Responsibility</h3>
    <ul>
      <li><b>Monitor and follow up ageing debts across all buckets</b> to recover money owed to the clinic</li>
      <li>Report on debt management with recommendations to Clinic Partner(s)/Team Leaders and Regional Partners regularly</li>
    </ul>
    <h3 class="sub">Ageing Debt Actions By Bucket</h3>
    <table><tr><th>Bucket</th><th>Private Clients</th><th>Third Party Payers</th></tr>
      <tr><td>0–30 days</td><td>Call/SMS/email within 48hrs of appt</td><td>Check rejections; resubmit via portal</td></tr>
      <tr><td>31–60 days</td><td>Call to discuss + take payment; note on invoice</td><td>Call payer, confirm invoice received, email follow-up</td></tr>
      <tr><td>61–90 days</td><td>Final call/email/SMS; alert note on file</td><td>Final follow-up; ask cause of delay; alert note</td></tr>
      <tr><td>90+ days</td><td>Determine recoverable vs not</td><td>If unrecoverable → Doubtful Debt Write-Off process</td></tr>
    </table>
    <h3 class="sub">Nookal Ageing Debts Report</h3>
    <ul>
      <li>Reports tab → Ageing Debts. Use "Expanded details" to see itemised invoices</li>
      <li>Export as XLSX (not CSV) if you plan to add notes — CSV doesn't retain them</li>
      <li>Click the invoice reference in Nookal to process, check portal status, or re-email</li>
    </ul>
    <div class="note navy"><b>EMAIL TEMPLATES</b>Use the correct template for the bucket: Reminder (0–30), Further Reminder (30–60), Final Notice (61–90 &amp; 90+). See the full SOP for wording.</div>
  `},
  {id:'cp', label:'Clinic Partner / CCS / CM', html:`
    <h2 class="rt">Clinic Partner, CCS &amp; Clinic Manager — Quick Reference</h2>
    <h3 class="sub">Your Core Responsibility</h3>
    <ul>
      <li><b>Debt management is a KPI for your clinic</b> — it directly affects revenue reporting and P&amp;L</li>
      <li>Monitor ageing debts and recommendations from your Admin/PM team</li>
      <li>Escalate unrecoverable debt to your Regional Partner</li>
    </ul>
    <h3 class="sub">Doubtful Debt Write-Off — Your Role</h3>
    <ul>
      <li>Criteria: 90–120+ days overdue, unresponsive despite repeated attempts, unlikely to recover via debt collection, or Third Party has rejected the claim outright</li>
      <li>Clinic must be profitable for a write-off to proceed</li>
      <li>You are the FIRST approval step — review the "Doubtful Debtors – COST CODE – MONTH" file before it goes to your Regional Partner</li>
    </ul>
    <h3 class="sub">Approval Thresholds (for awareness)</h3>
    <table><tr><th>Total Doubtful Debt Value</th><th>Who Approves</th></tr>
      <tr><td>Under $1,000</td><td>Regional Partner</td></tr>
      <tr><td>$1,000 – $5,000</td><td>General Manager</td></tr>
      <tr><td>Over $5,000</td><td>CFO</td></tr>
    </table>
    <div class="note gold"><b>MONTHLY CADENCE</b>Doubtful Debt Write-Offs are submitted monthly. Don't let them stockpile — timely reporting keeps your clinic's true debt position accurate.</div>
  `},
];

const tabsEl = document.getElementById('roleTabs');
const panelsEl = document.getElementById('panels');
roles.forEach((r,i)=>{
  const btn = document.createElement('button');
  btn.className = 'role-tab' + (i===0?' active':'');
  btn.textContent = r.label;
  btn.onclick = ()=> showRole(r.id);
  tabsEl.appendChild(btn);
  const panel = document.createElement('div');
  panel.className = 'panel' + (i===0?' active':'');
  panel.id = 'panel-'+r.id;
  panel.innerHTML = r.html;
  panelsEl.appendChild(panel);
});
function showRole(id){
  document.querySelectorAll('.role-tab').forEach((b,i)=> b.classList.toggle('active', roles[i].id===id));
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-'+id));
}
</script>
<script src="assets/knowledge-base.js"></script>
<script src="assets/site-assistant.js"></script>
</body>
</html>
