<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior Receptionist & PM Training | Healthia</title>
<style>
  :root{--navy:#1B4F8C;--teal:#028090;--purple:#028090;--dark:#1C2B3A;--grey:#6B7C8E;--lgrey:#D6E0EB;--offwh:#F4F6F9;--red:#C0392B;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:var(--offwh);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .gate{background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);max-width:420px;width:100%;padding:36px 32px;text-align:center;border-top:6px solid var(--purple);}
  .gate h1{color:var(--navy);font-size:1.25rem;margin-bottom:8px;}
  .gate p{color:var(--grey);font-size:.88rem;line-height:1.6;margin-bottom:22px;}
  input{width:100%;padding:11px 12px;border:1px solid var(--lgrey);border-radius:6px;font-size:1rem;text-align:center;letter-spacing:.05em;margin-bottom:12px;}
  button{width:100%;background:var(--purple);color:#fff;border:none;padding:11px;border-radius:6px;font-size:.9rem;font-weight:700;cursor:pointer;}
  button:hover{opacity:.9;}
  .err{color:var(--red);font-size:.82rem;font-weight:700;margin-top:10px;min-height:18px;}
  .back{display:inline-block;margin-top:18px;color:var(--teal);font-size:.82rem;text-decoration:none;font-weight:700;}
</style>
</head>
<body>
  <div class="gate">
    <h1>🔒 Senior Receptionist & PM Training</h1>
    <p>This module covers the full ageing debt follow-up framework. Enter the access code sent to you by your manager.</p>
    <input type="password" id="code" placeholder="Access code" autofocus>
    <button onclick="checkCode()">Continue</button>
    <div class="err" id="err"></div>
    <a class="back" href="../index.html">← Back to training hub</a>
  </div>
<script>
// Lightweight deterrent, not real security — anyone viewing this page's
// source can see the hash. Suitable for keeping content within its
// intended audience, not for anything genuinely confidential.
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const CODE_HASH = "12e7eb30f451f965f9104be87c28bbd172958dcc0a49351c37ed50b41add9360";

async function checkCode(){
  const val = document.getElementById('code').value.trim();
  const err = document.getElementById('err');
  if(!val){ err.textContent='Enter the access code.'; return; }
  const hash = await sha256(val);
  if(hash === CODE_HASH){
    sessionStorage.setItem('module2_access_granted','1');
    window.location.href = 'module2.html';
  } else {
    err.textContent = 'Incorrect code. Check with your manager.';
  }
}
document.getElementById('code').addEventListener('keydown', e=>{ if(e.key==='Enter') checkCode(); });
</script>
</body>
</html>
